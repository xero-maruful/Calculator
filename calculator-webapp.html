<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card mx-auto shadow" style="max-width: 350px;">
            <div class="card-body">

                <h3 class="text-center mb-3">Calculator</h3>

                <input type="text"
                       id="display"
                       class="form-control form-control-lg mb-3 text-end"
                       readonly>

                <div class="row g-2">

                    <div class="col-3">
                        <button class="btn btn-danger w-100" onclick="clearDisplay()">C</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-secondary w-100" onclick="addValue('/')">÷</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-secondary w-100" onclick="addValue('*')">×</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-secondary w-100" onclick="deleteLast()">⌫</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="addValue('7')">7</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="addValue('8')">8</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="addValue('9')">9</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-secondary w-100" onclick="addValue('-')">−</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="addValue('4')">4</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="addValue('5')">5</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="addValue('6')">6</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-secondary w-100" onclick="addValue('+')">+</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="addValue('1')">1</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="addValue('2')">2</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="addValue('3')">3</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-primary w-100" onclick="calculate()">=</button>
                    </div>

                    <div class="col-6">
                        <button class="btn btn-light border w-100" onclick="addValue('0')">0</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="addValue('.')">.</button>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const display = document.getElementById("display");

        function addValue(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = "";
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        function calculate() {
            try {
                display.value = eval(display.value);
            } catch (error) {
                display.value = "Error";
            }
        }
    </script>

</body>
</html>
